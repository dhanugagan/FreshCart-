name: FreshCart Automated Testing & CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: 1. TypeScript Lint & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: freshcart-dist
          path: dist/

  python-flask-backend-tests:
    name: 2. Python Flask & SQL API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests/test_flask_api.py -v

  playwright-automation-suite:
    name: 3. Playwright POM Automated E2E & API Tests
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api-integration, chromium-e2e, firefox-e2e, webkit-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Browser (${{ matrix.project }})
        if: matrix.project != 'api-integration'
        run: |
          case "${{ matrix.project }}" in
            chromium-e2e) npx playwright install --with-deps chromium ;;
            firefox-e2e) npx playwright install --with-deps firefox ;;
            webkit-e2e) npx playwright install --with-deps webkit ;;
          esac
      - name: Run Playwright Tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright HTML & JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            tests/temp/

  docker-container-verify:
    name: 4. Docker Image Verification
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FreshCart Docker Container
        run: docker build -t freshcart-e2e:ci .

  vercel-deploy:
    name: 5. Deploy Full-Stack App to Vercel
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint-and-build, python-flask-backend-tests, playwright-automation-suite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping Vercel deploy: configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repository secrets."
            exit 0
          fi
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

